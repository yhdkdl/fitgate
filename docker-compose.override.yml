# Local Development Override - Dev Convenience Only
# Note: pgAdmin is strictly a local dev utility and is NEVER used in production.
services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fitgate_pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@fitgate.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: "/pgadmin4/servers.json"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin-config/pgpass:ro
      - pgadmin_data:/var/lib/pgadmin
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /pgadmin-config/pgpass /tmp/pgpass
        chmod 600 /tmp/pgpass
        exec /entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgadmin_data:
