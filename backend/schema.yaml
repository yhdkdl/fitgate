openapi: 3.0.3
info:
  title: FitGate API
  version: 1.0.0
  description: Multi-tenant Gym Management Platform API for Ethiopian Gyms
paths:
  /api/attendance/public-key/:
    get:
      operationId: attendance_public_key_retrieve
      description: Returns the RSA public key used to verify asymmetric QR check-in
        tokens offline.
      summary: Get QR Verification Public Key
      tags:
      - attendance
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendancePublicKeyResponse'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Validates current password and updates to new password, invalidating
        older tokens.
      summary: Change user password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates user with email and password, returning tokens and
        dashboard config.
      summary: User login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          description: Invalid credentials
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the provided refresh token.
      summary: User logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Successfully logged out
        '400':
          description: Invalid refresh token
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns profile information for the authenticated caller.
      summary: Get current user profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Password change required
    patch:
      operationId: auth_me_partial_update
      description: Updates full_name and/or phone for the authenticated caller. Rejects
        privileged fields.
      summary: Update current user profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Password change required
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: Initiates password reset process for the specified email. Always
        returns 200.
      summary: Request password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
          description: ''
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Resets user password using a single-use token and strong new password.
      summary: Confirm password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
          description: ''
        '400':
          description: Invalid token, expired token, or weak password
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Issues a fresh access token given a valid refresh token.
      summary: Refresh access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          description: Invalid or expired refresh token
  /api/auth/set-password/:
    post:
      operationId: auth_set_password_create
      description: Consumes a single-use invite token and sets initial password for
        an invited user.
      summary: Set password from invite
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordFromInviteRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPasswordFromInviteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPasswordFromInviteRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPasswordFromInviteResponse'
          description: ''
        '400':
          description: Invalid or expired token, or weak password
  /api/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Validates single-use token to verify self-registered member email
        address.
      summary: Verify member email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid or expired token
  /api/gym/assignments/:
    get:
      operationId: gym_assignments_list
      description: Returns trainer assignments for the gym.
      summary: List gym trainer assignments (Owner, Manager)
      tags:
      - trainers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainerAssignmentDetail'
          description: ''
        '401':
          description: Authentication required
        '403':
          description: Forbidden
  /api/gym/assignments/reassign/:
    post:
      operationId: gym_assignments_reassign_create
      description: Closes the previous open assignment and opens a new one.
      summary: Manually assign or reassign trainer (Owner, Manager)
      tags:
      - trainers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualReassignRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManualReassignRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManualReassignRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualReassignResponse'
          description: ''
        '400':
          description: Validation error or capacity confirmation needed
        '401':
          description: Authentication required
        '403':
          description: Forbidden
        '404':
          description: Member or Trainer not found
  /api/gym/attendance/manual-override/:
    post:
      operationId: gym_attendance_manual_override_create
      description: Records a manual attendance check-in when QR cannot be used. Audit-logged.
      summary: Manual Check-in Override
      tags:
      - gym
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceManualOverrideRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttendanceManualOverrideRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttendanceManualOverrideRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceManualOverrideResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceScanErrorResponse'
          description: ''
  /api/gym/attendance/scan/:
    post:
      operationId: gym_attendance_scan_create
      description: Validates a member QR token, records attendance, and issues replacement
        token.
      summary: Scan QR Check-in Token
      tags:
      - gym
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceScanRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttendanceScanRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttendanceScanRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceScanResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceScanErrorResponse'
          description: ''
  /api/gym/attendance/today/:
    get:
      operationId: gym_attendance_today_retrieve
      description: Returns today's attendance check-in list ordered newest first (max
        50) and total count. Supports optional 'since' parameter.
      summary: List Today's Check-ins
      parameters:
      - in: query
        name: since
        schema:
          type: string
        description: Optional ISO timestamp to filter check-ins newer than this time.
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceTodayListResponse'
          description: ''
  /api/gym/audit-logs/:
    get:
      operationId: gym_audit_logs_list
      description: Returns paginated, newest-first audit log events for the current
        gym tenant.
      summary: List gym audit logs
      parameters:
      - in: query
        name: action_type
        schema:
          type: string
        description: Filter by exact action type (e.g. user_login, staff_provisioned)
      - in: query
        name: actor_id
        schema:
          type: string
        description: Filter by actor UUID
      - in: query
        name: date_from
        schema:
          type: string
        description: Filter records starting from date (YYYY-MM-DD) or ISO timestamp
      - in: query
        name: date_to
        schema:
          type: string
        description: Filter records ending at date (YYYY-MM-DD) or ISO timestamp
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Number of records per page (default 20, max 100)
      - in: query
        name: search
        schema:
          type: string
        description: Search query across actor email, action type, or affected record
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
        '401':
          description: Authentication required
        '403':
          description: Forbidden
  /api/gym/checklist/:
    get:
      operationId: gym_checklist_retrieve
      description: Returns first-run checklist progress for the gym Owner.
      summary: Get first-run onboarding checklist
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirstRunChecklistResponse'
          description: ''
        '403':
          description: Forbidden - only Owner permitted
  /api/gym/checklist/dismiss/:
    post:
      operationId: gym_checklist_dismiss_create
      description: Persists dismissal of onboarding checklist for the gym.
      summary: Dismiss first-run onboarding checklist
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DismissChecklistResponse'
          description: ''
        '403':
          description: Forbidden - only Owner permitted
  /api/gym/freezes/:
    get:
      operationId: gym_freezes_list
      description: Returns all freeze requests for the gym, filterable by status.
      summary: List gym freeze requests (Owner, Manager)
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberFreeze'
          description: ''
  /api/gym/freezes/{freeze_id}/approve/:
    post:
      operationId: gym_freezes_approve_create
      description: Approves a member freeze, pauses pass, extends subscription end
        date once, and notifies member.
      summary: Approve a freeze request (Owner, Manager)
      parameters:
      - in: path
        name: freeze_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberFreeze'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Permission denied
  /api/gym/freezes/{freeze_id}/end-early/:
    post:
      operationId: gym_freezes_end_early_create
      description: Ends an approved member freeze early, reduces extension by unused
        days, returns unused days to allowance, and reactivates member pass immediately.
      summary: End a freeze early (Owner, Manager, Reception)
      parameters:
      - in: path
        name: freeze_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberFreeze'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Permission denied
  /api/gym/freezes/{freeze_id}/reject/:
    post:
      operationId: gym_freezes_reject_create
      description: Rejects a member freeze request with explanation and notifies member.
      summary: Reject a freeze request (Owner, Manager)
      parameters:
      - in: path
        name: freeze_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gym
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberFreezeRejectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MemberFreezeRejectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemberFreezeRejectRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberFreeze'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Permission denied
  /api/gym/members/:
    get:
      operationId: gym_members_list
      description: Retrieves a list of members belonging to the current gym tenant.
      summary: List gym members
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
    post:
      operationId: gym_members_create
      description: Registers a new member with set-password invitation link. Allowed
        for Owner, Manager, Reception.
      summary: Staff-assisted member registration
      tags:
      - gym
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffMemberRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffMemberRegistrationRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/StaffMemberRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '400':
          description: Validation error or duplicate
        '403':
          description: Forbidden - Trainers cannot register members
  /api/gym/members/{member_id}/end-freeze-early/:
    post:
      operationId: gym_members_end_freeze_early_create
      description: Finds the approved freeze for a member and ends it early, returning
        unused days to allowance and reactivating their pass immediately.
      summary: End a member's freeze early (Owner, Manager, Reception)
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberFreeze'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Permission denied
        '404':
          description: Member or freeze not found
  /api/gym/members/{member_id}/fitness-profile/:
    get:
      operationId: gym_members_fitness_profile_retrieve
      description: |-
        Fitness profile endpoint for a gym member.
        GET: Retrieves the fitness profile along with latest trainer measurements.
        POST / PUT: Creates or updates the fitness profile.
        Access strictly enforced:
        - Assigned Trainer: Allowed
        - Owner / Manager: Allowed
        - Unrelated Trainer, Reception, Super Admin, other gyms, Member: 403 Forbidden.
      summary: Get member fitness profile
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessProfile'
          description: ''
    post:
      operationId: gym_members_fitness_profile_create
      description: |-
        Fitness profile endpoint for a gym member.
        GET: Retrieves the fitness profile along with latest trainer measurements.
        POST / PUT: Creates or updates the fitness profile.
        Access strictly enforced:
        - Assigned Trainer: Allowed
        - Owner / Manager: Allowed
        - Unrelated Trainer, Reception, Super Admin, other gyms, Member: 403 Forbidden.
      summary: Create or update member fitness profile
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gym
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FitnessProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FitnessProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FitnessProfileRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessProfile'
          description: ''
    put:
      operationId: gym_members_fitness_profile_update
      description: |-
        Fitness profile endpoint for a gym member.
        GET: Retrieves the fitness profile along with latest trainer measurements.
        POST / PUT: Creates or updates the fitness profile.
        Access strictly enforced:
        - Assigned Trainer: Allowed
        - Owner / Manager: Allowed
        - Unrelated Trainer, Reception, Super Admin, other gyms, Member: 403 Forbidden.
      summary: Update member fitness profile
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gym
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FitnessProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FitnessProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FitnessProfileRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessProfile'
          description: ''
    patch:
      operationId: gym_members_fitness_profile_partial_update
      description: |-
        Fitness profile endpoint for a gym member.
        GET: Retrieves the fitness profile along with latest trainer measurements.
        POST / PUT: Creates or updates the fitness profile.
        Access strictly enforced:
        - Assigned Trainer: Allowed
        - Owner / Manager: Allowed
        - Unrelated Trainer, Reception, Super Admin, other gyms, Member: 403 Forbidden.
      summary: Partially update member fitness profile
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gym
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFitnessProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFitnessProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFitnessProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessProfile'
          description: ''
  /api/gym/members/{id}/:
    get:
      operationId: gym_members_retrieve
      description: Retrieves detailed member profile with body metrics history and
        estimates.
      summary: Get member details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
          description: ''
        '404':
          description: Not found
    patch:
      operationId: gym_members_partial_update
      description: Allows Owner, Manager, or Reception to update member information.
      summary: Update member profile
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gym
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMemberUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
