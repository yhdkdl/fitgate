openapi: 3.0.3
info:
  title: FitGate API
  version: 1.0.0
  description: Multi-tenant Gym Management Platform API for Ethiopian Gyms
paths:
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Validates current password and updates to new password, invalidating
        older tokens.
      summary: Change user password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates user with email and password, returning tokens and
        dashboard config.
      summary: User login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          description: Invalid credentials
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the provided refresh token.
      summary: User logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Successfully logged out
        '400':
          description: Invalid refresh token
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns profile information for the authenticated caller.
      summary: Get current user profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Password change required
    patch:
      operationId: auth_me_partial_update
      description: Updates full_name and/or phone for the authenticated caller. Rejects
        privileged fields.
      summary: Update current user profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Password change required
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: Initiates password reset process for the specified email. Always
        returns 200.
      summary: Request password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
          description: ''
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Resets user password using a single-use token and strong new password.
      summary: Confirm password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
          description: ''
        '400':
          description: Invalid token, expired token, or weak password
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Issues a fresh access token given a valid refresh token.
      summary: Refresh access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          description: Invalid or expired refresh token
  /api/health/:
    get:
      operationId: health_retrieve
      description: Returns the operational status of the FitGate backend service.
      summary: Health check
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
  /api/platform/super-admins/:
    post:
      operationId: platform_super_admins_create
      description: Creates a new Super Admin account. Requires active Super Admin
        credentials.
      summary: Create additional Super Admin
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSuperAdminRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateSuperAdminRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSuperAdminRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperAdminResponse'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Forbidden
components:
  schemas:
    ChangePasswordRequestRequest:
      type: object
      description: Payload for changing user password.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    ChangePasswordResponse:
      type: object
      description: Response containing refreshed JWT pair and user summary.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access
      - refresh
      - user
    CreateSuperAdminRequestRequest:
      type: object
      description: Payload for creating an additional Super Admin account.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        current_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - email
      - password
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          default: ok
        app:
          type: string
          default: FitGate API
    LoginRequestRequest:
      type: object
      description: Payload for user authentication.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      description: Response containing JWT tokens, user summary, and role dashboard.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
        dashboard:
          type: object
          additionalProperties: {}
      required:
      - access
      - dashboard
      - refresh
      - user
    LogoutRequestRequest:
      type: object
      description: Payload for user logout.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    PasswordResetConfirmRequestRequest:
      type: object
      description: Payload for confirming a password reset.
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - token
    PasswordResetConfirmResponse:
      type: object
      description: Response returned upon successful password reset completion.
      properties:
        detail:
          type: string
      required:
      - detail
    PasswordResetRequestRequest:
      type: object
      description: Payload for requesting a password reset email.
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PasswordResetResponse:
      type: object
      description: Uniform response for password reset requests.
      properties:
        detail:
          type: string
      required:
      - detail
    PatchedUserProfileUpdateRequest:
      type: object
      description: Payload for updating user profile (full_name and phone only).
      properties:
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
    RoleEnum:
      enum:
      - super_admin
      - owner
      - manager
      - trainer
      - reception
      - member
      type: string
      description: |-
        * `super_admin` - Super Admin
        * `owner` - Owner
        * `manager` - Manager
        * `trainer` - Trainer
        * `reception` - Reception
        * `member` - Member
    SuperAdminResponse:
      type: object
      description: Response for created Super Admin.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - must_change_password
      - role
    TokenRefreshRequestRequest:
      type: object
      description: Payload for token refresh.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenRefreshResponse:
      type: object
      description: Response containing refreshed access token.
      properties:
        access:
          type: string
      required:
      - access
    UserProfile:
      type: object
      description: Profile representation of authenticated user.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        gym_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
      required:
      - email
      - full_name
      - gym_id
      - id
      - must_change_password
      - phone
      - role
    UserSummary:
      type: object
      description: Minimal representation of authenticated user.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        gym_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
      required:
      - email
      - full_name
      - gym_id
      - id
      - must_change_password
      - phone
      - role
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
