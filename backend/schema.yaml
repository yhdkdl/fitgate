        * `super_admin` - Super Admin
        * `owner` - Owner
        * `manager` - Manager
        * `trainer` - Trainer
        * `reception` - Reception
        * `member` - Member
    UserSummary:
      type: object
      description: Minimal representation of authenticated user.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        gym_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
      required:
      - email
      - full_name
      - gym_id
      - id
      - must_change_password
      - phone
      - role
    VerifyEmailRequestRequest:
      type: object
      description: Serializer for email verification request.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
