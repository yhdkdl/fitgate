      summary: View gym payment mode (Super Admin)
      parameters:
      - in: path
        name: gym_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperAdminGymPaymentStatus'
          description: ''
  /api/platform/gyms/propose-subdomain/:
    get:
      operationId: platform_gyms_propose_subdomain_retrieve
      description: Generates a sanitized DNS label candidate for a proposed gym name.
      summary: Propose candidate subdomain
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposeSubdomainResponse'
          description: ''
  /api/platform/super-admins/:
    post:
      operationId: platform_super_admins_create
      description: Creates a new Super Admin account. Requires active Super Admin
        credentials.
      summary: Create additional Super Admin
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSuperAdminRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateSuperAdminRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSuperAdminRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperAdminResponse'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Forbidden
  /api/public/gym-entry/:
    get:
      operationId: public_gym_entry_retrieve
      description: Public endpoint returning gym branding, details, and active plans
        on the gym subdomain. Shows 503 if TLS is pending.
      summary: Public gym entry page
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymPublicEntryResponse'
          description: ''
        '503':
          description: Subdomain is still being secured
  /api/public/members/register/:
    post:
      operationId: public_members_register_create
      description: Public registration for new gym members on a gym subdomain. Requires
        health waiver.
      summary: Self-service member registration
      tags:
      - public
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicMemberRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicMemberRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicMemberRegistrationRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '400':
          description: Validation error, missing waiver, or duplicate email/phone
        '404':
          description: Gym tenant not found
  /api/public/plans/:
    get:
      operationId: public_plans_list
      description: Visitors can view all active plans and prices without logging in.
      summary: List active plans publicly
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicPlan'
          description: ''
  /api/trainers/me/:
    get:
      operationId: trainers_me_retrieve
      description: Returns the authenticated trainer's profile, client count, and
        capacity.
      summary: Get own trainer profile (Trainer only)
      tags:
      - trainers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trainer'
          description: ''
        '401':
          description: Authentication required
        '403':
          description: Permission denied or trainer module not enabled
        '404':
          description: Trainer profile not found
  /api/trainers/me/clients/:
    get:
      operationId: trainers_me_clients_list
      description: Returns list of active clients assigned to the logged-in trainer.
      summary: View own assigned clients (Trainer only)
      tags:
      - trainers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainerMyClient'
          description: ''
        '401':
          description: Authentication required
        '403':
          description: Forbidden
  /api/webhooks/brevo/:
    post:
      operationId: webhooks_brevo_create
      description: |-
        Webhook endpoint on apex domain for Brevo transactional delivery event webhooks.
        Accepts POST at /api/webhooks/brevo/, authenticated with BREVO_WEBHOOK_SECRET.
        Secret passed via:
        - Header: X-Webhook-Secret
        - Header: Authorization: Bearer <secret>
        - Query parameter: ?secret=<secret>

        Wrong or missing secret returns the exact same response as an unknown event:
        {"status": "ignored"} with HTTP 200 OK.

        Suppression events (hardBounce, blocked, spam, invalid) record the email
        in EmailDeliveryStatus with status='suppressed'.
        Returns {"status": "processed"} with HTTP 200 OK.
      tags:
      - webhooks
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/webhooks/chapa/:
    post:
      operationId: webhooks_chapa_create
      description: Processes Chapa webhook notifications with HMAC verification and
        idempotency.
      summary: Chapa payment webhook notification
      tags:
      - webhooks
      security:
      - {}
      responses:
        '200':
          description: Payment confirmed or already handled
        '400':
          description: Invalid payload or verification failure
        '401':
          description: Invalid signature
        '502':
          description: Gateway verification failure
components:
  schemas:
    AttendanceLogResponse:
      type: object
      description: Response serializer for attendance calendar log.
      properties:
        member_id:
          type: string
          format: uuid
        member_name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        subscription_period:
          type: object
          additionalProperties: {}
        days:
          type: array
          items:
            $ref: '#/components/schemas/DailyAttendanceItem'
      required:
      - days
      - end_date
      - member_id
      - member_name
      - start_date
      - subscription_period
    AttendanceManualOverrideRequestRequest:
      type: object
      description: Request serializer for manual attendance override by reception.
      properties:
        member_id:
          type: string
          format: uuid
          description: UUID of the member to check in.
        reason:
          type: string
          minLength: 5
          description: Explanation for manual override (5 to 500 characters).
          maxLength: 500
        branch_id:
          type: string
          format: uuid
          nullable: true
          description: Optional branch UUID.
      required:
      - member_id
      - reason
    AttendanceManualOverrideResponse:
      type: object
      description: Response serializer for manual attendance override.
      properties:
        status:
          type: string
          default: success
        message:
          type: string
        member:
          $ref: '#/components/schemas/AttendanceScanResultMember'
        attendance:
          $ref: '#/components/schemas/AttendanceRecord'
      required:
      - attendance
      - member
      - message
    AttendancePublicKeyResponse:
      type: object
      description: Response serializer for public key export.
      properties:
        public_key:
          type: string
          description: PEM-encoded Ed25519 public key for offline QR signature verification.
        algorithm:
          type: string
          default: EdDSA
      required:
      - public_key
    AttendanceRecord:
      type: object
      description: Attendance record details.
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        checked_in_at:
          type: string
          format: date-time
        method:
          type: string
        is_override:
          type: boolean
        override_reason:
          type: string
      required:
      - checked_in_at
      - date
      - id
      - is_override
      - method
    AttendanceScanErrorResponse:
      type: object
      properties:
        detail:
          type: string
        reason:
          type: string
        member:
          $ref: '#/components/schemas/AttendanceScanResultMember'
      required:
      - detail
      - reason
    AttendanceScanRequestRequest:
      type: object
      description: Request serializer for QR attendance scan.
      properties:
        token:
          type: string
          minLength: 1
          description: Scanned QR token string (EdDSA JWT).
          maxLength: 2048
        branch_id:
          type: string
          format: uuid
          nullable: true
          description: Optional branch UUID for multi-branch check-ins.
      required:
      - token
    AttendanceScanResponse:
      type: object
      description: Success response serializer for QR scan.
      properties:
        status:
          type: string
          default: success
        message:
          type: string
        member:
          $ref: '#/components/schemas/AttendanceScanResultMember'
        attendance:
          $ref: '#/components/schemas/AttendanceRecord'
        next_token:
          type: string
          description: Newly rotated token issued for the member.
      required:
      - attendance
      - member
      - message
      - next_token
    AttendanceScanResultMember:
      type: object
      description: Member details returned upon scan.
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        photo_url:
          type: string
        status:
          type: string
        phone:
          type: string
      required:
      - full_name
      - id
      - photo_url
      - status
    AttendanceTodayItem:
      type: object
      description: Entry in Today's Check-ins list.
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        member_name:
          type: string
        member_photo_url:
          type: string
        checked_in_at:
          type: string
          format: date-time
        method:
          type: string
        is_override:
          type: boolean
        override_reason:
          type: string
        recorded_by_name:
          type: string
          nullable: true
      required:
      - checked_in_at
      - id
      - is_override
      - member_id
      - member_name
      - member_photo_url
      - method
    AttendanceTodayListResponse:
      type: object
      description: Response serializer for live Today's Check-ins list.
      properties:
        total_count:
          type: integer
          description: Total number of members checked in today.
        results:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceTodayItem'
      required:
      - results
      - total_count
    AuditLog:
      type: object
      description: Read-only representation of an AuditLog entry.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        gym_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        gym_name:
          type: string
          readOnly: true
          nullable: true
        actor:
          allOf:
          - $ref: '#/components/schemas/AuditLogActor'
          readOnly: true
        action_type:
          type: string
          readOnly: true
        affected_record_type:
          type: string
          readOnly: true
        affected_record_id:
          type: string
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        metadata:
          readOnly: true
          nullable: true
