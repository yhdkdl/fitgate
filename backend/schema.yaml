        height_cm:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        measurements: {}
        recorded_at:
          type: string
          format: date-time
          readOnly: true
        recorded_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        trainer_name:
          type: string
          readOnly: true
        recorded_by_name:
          type: string
          readOnly: true
        estimated_bmi:
          type: number
          format: double
          readOnly: true
        estimated_body_fat_percentage:
          type: number
          format: double
          readOnly: true
        bmi_label:
          type: string
          readOnly: true
        body_fat_label:
          type: string
          readOnly: true
        waist_to_hip_ratio:
          type: number
          format: double
          readOnly: true
        lean_body_mass:
          type: number
          format: double
          readOnly: true
        lean_body_mass_label:
          type: string
          readOnly: true
        is_corrected:
          type: boolean
