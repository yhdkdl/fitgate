openapi: 3.0.3
info:
  title: FitGate API
  version: 1.0.0
  description: Multi-tenant Gym Management Platform API for Ethiopian Gyms
paths:
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Validates current password and updates to new password, invalidating
        older tokens.
      summary: Change user password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates user with email and password, returning tokens and
        dashboard config.
      summary: User login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          description: Invalid credentials
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the provided refresh token.
      summary: User logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Successfully logged out
        '400':
          description: Invalid refresh token
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns profile information for the authenticated caller.
      summary: Get current user profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Password change required
    patch:
      operationId: auth_me_partial_update
      description: Updates full_name and/or phone for the authenticated caller. Rejects
        privileged fields.
      summary: Update current user profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Password change required
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: Initiates password reset process for the specified email. Always
        returns 200.
      summary: Request password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
          description: ''
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Resets user password using a single-use token and strong new password.
      summary: Confirm password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
          description: ''
        '400':
          description: Invalid token, expired token, or weak password
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Issues a fresh access token given a valid refresh token.
      summary: Refresh access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          description: Invalid or expired refresh token
  /api/auth/set-password/:
    post:
      operationId: auth_set_password_create
      description: Consumes a single-use invite token and sets initial password for
        an invited user.
      summary: Set password from invite
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordFromInviteRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPasswordFromInviteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPasswordFromInviteRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPasswordFromInviteResponse'
          description: ''
        '400':
          description: Invalid or expired token, or weak password
  /api/health/:
    get:
      operationId: health_retrieve
      description: Returns the operational status of the FitGate backend service.
      summary: Health check
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
  /api/platform/demo-requests/:
    get:
      operationId: platform_demo_requests_list
      description: Super Admin endpoint to view and filter demo request leads.
      summary: List demo requests
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoRequest'
          description: ''
  /api/platform/demo-requests/{id}/:
    get:
      operationId: platform_demo_requests_retrieve
      description: Super Admin endpoint to retrieve and update demo request status/notes.
      summary: Get demo request detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRequest'
          description: ''
        '404':
          description: Not found
    patch:
      operationId: platform_demo_requests_partial_update
      description: Super Admin endpoint to retrieve and update demo request status/notes.
      summary: Update demo request status or notes
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDemoRequestUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDemoRequestUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDemoRequestUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRequest'
          description: ''
        '400':
          description: Bad request
        '404':
          description: Not found
  /api/platform/demo-requests/{id}/convert/:
    get:
      operationId: platform_demo_requests_convert_retrieve
      description: Super Admin endpoint returning pre-filled data to convert a lead
        to a gym.
      summary: Convert demo request to gym form data
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRequestConvertResponse'
          description: ''
        '404':
          description: Not found
  /api/platform/demo-requests/public/:
    post:
      operationId: platform_demo_requests_public_create
      description: Public endpoint to request a demo for a gym. Only accepted on the
        apex domain.
      summary: Submit demo request
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicDemoRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicDemoRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicDemoRequestRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDemoRequestResponse'
          description: ''
        '400':
          description: Bad request or rejected on subdomain
        '429':
          description: Too many requests
  /api/platform/gyms/:
    get:
      operationId: platform_gyms_list
      description: Lists all gym tenants on the platform for Super Admin.
      summary: List gym tenants
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GymTenantSummary'
          description: ''
    post:
      operationId: platform_gyms_create
      description: Super Admin creates an active gym tenant, records bank transfer
        payment, and provisions subdomain.
      summary: Create gym tenant
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGymRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateGymRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateGymRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGymResponse'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Forbidden
  /api/platform/gyms/{gym_id}/:
    get:
      operationId: platform_gyms_retrieve
      description: Retrieves a specific gym tenant and its configuration.
      summary: Get gym tenant details
      parameters:
      - in: path
        name: gym_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymDetailResponse'
          description: ''
        '404':
          description: Not found
  /api/platform/gyms/{gym_id}/confirm-tls/:
    post:
      operationId: platform_gyms_confirm_tls_create
      description: Confirms subdomain TLS certificate, activating login access and
        establishing subscription expiry.
      summary: Confirm gym TLS certificate
      parameters:
      - in: path
        name: gym_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmTLSResponse'
          description: ''
        '400':
          description: Gym not found
        '403':
          description: Forbidden
  /api/platform/gyms/propose-subdomain/:
    get:
      operationId: platform_gyms_propose_subdomain_retrieve
      description: Generates a sanitized DNS label candidate for a proposed gym name.
      summary: Propose candidate subdomain
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposeSubdomainResponse'
          description: ''
  /api/platform/super-admins/:
    post:
      operationId: platform_super_admins_create
      description: Creates a new Super Admin account. Requires active Super Admin
        credentials.
      summary: Create additional Super Admin
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSuperAdminRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateSuperAdminRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSuperAdminRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperAdminResponse'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Forbidden
components:
  schemas:
    ChangePasswordRequestRequest:
      type: object
      description: Payload for changing user password.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    ChangePasswordResponse:
      type: object
      description: Response containing refreshed JWT pair and user summary.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access
      - refresh
      - user
    ConfirmTLSResponse:
      type: object
      description: Response returned upon TLS certificate confirmation.
      properties:
        gym:
          $ref: '#/components/schemas/GymTenantSummary'
        message:
          type: string
      required:
      - gym
      - message
    CreateGymRequestRequest:
      type: object
      description: Payload for Super Admin gym creation.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        subdomain:
          type: string
          minLength: 1
          maxLength: 63
        tier:
          $ref: '#/components/schemas/TierEnum'
        location:
          type: string
          default: ''
          maxLength: 255
        contact_name:
          type: string
          default: ''
          maxLength: 150
        contact_phone:
          type: string
          default: ''
          maxLength: 20
        contact_email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
        owner_name:
          type: string
          default: ''
          maxLength: 150
        owner_email:
          type: string
          format: email
          minLength: 1
        payment_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        payment_reference:
          type: string
          minLength: 1
          maxLength: 100
        payment_method:
          type: string
          minLength: 1
          default: bank_transfer
          maxLength: 30
        demo_request_id:
          type: string
          nullable: true
          maxLength: 100
      required:
      - name
      - owner_email
      - payment_amount
      - payment_reference
      - subdomain
      - tier
    CreateGymResponse:
      type: object
      description: Response returned upon successful gym tenant creation.
      properties:
        gym:
          $ref: '#/components/schemas/GymTenantSummary'
        config:
          $ref: '#/components/schemas/GymConfig'
        owner:
          $ref: '#/components/schemas/UserSummary'
        payment_id:
          type: string
          format: uuid
        invite_link:
          type: string
      required:
      - config
      - gym
      - invite_link
      - owner
      - payment_id
    CreateSuperAdminRequestRequest:
      type: object
      description: Payload for creating an additional Super Admin account.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        current_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - email
      - password
    DemoRequest:
      type: object
      description: Serializer for Super Admin lead management.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        gym_name:
          type: string
          readOnly: true
        contact_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        message:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/DemoRequestStatusEnum'
        notes:
          type: string
        handled_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        handled_by_email:
          type: string
          nullable: true
          readOnly: true
        converted_gym:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        converted_gym_subdomain:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - contact_name
      - converted_gym
      - converted_gym_subdomain
      - created_at
      - email
      - gym_name
      - handled_by
      - handled_by_email
      - id
      - message
      - phone
      - updated_at
    DemoRequestConvertResponse:
      type: object
      description: Data returned to pre-fill the Create Gym form from a demo request.
      properties:
        demo_request_id:
          type: string
          format: uuid
        name:
          type: string
        contact_name:
          type: string
        contact_phone:
          type: string
        contact_email:
          type: string
          format: email
        location:
          type: string
      required:
      - contact_email
      - contact_name
      - contact_phone
      - demo_request_id
      - location
      - name
    DemoRequestStatusEnum:
      enum:
      - new
      - contacted
      - demo_done
      - converted
      - lost
      type: string
      description: |-
        * `new` - New
        * `contacted` - Contacted
        * `demo_done` - Demo Done
        * `converted` - Converted
        * `lost` - Lost
    GymConfig:
      type: object
      description: Feature gating and configuration settings of a gym.
      properties:
        has_trainer_module:
          type: boolean
          readOnly: true
        has_ai_plans:
          type: boolean
          readOnly: true
        has_analytics:
          type: boolean
          readOnly: true
        has_group_classes:
          type: boolean
          readOnly: true
        has_multi_branch:
          type: boolean
          readOnly: true
        freeze_days_allowed:
          type: integer
          readOnly: true
        payment_grace_days:
          type: integer
          readOnly: true
        subscription_reminder_days:
          readOnly: true
        member_reminder_days:
          readOnly: true
      required:
      - freeze_days_allowed
      - has_ai_plans
      - has_analytics
      - has_group_classes
      - has_multi_branch
      - has_trainer_module
      - member_reminder_days
      - payment_grace_days
      - subscription_reminder_days
    GymDetailResponse:
      type: object
      properties:
        gym:
          $ref: '#/components/schemas/GymTenantSummary'
        config:
          $ref: '#/components/schemas/GymConfig'
      required:
      - config
      - gym
    GymStatusEnum:
      enum:
      - pending
      - active
      - suspended
      - terminated
      type: string
      description: |-
        * `pending` - Pending
        * `active` - Active
        * `suspended` - Suspended
        * `terminated` - Terminated
    GymTenantSummary:
      type: object
      description: Summary of a gym tenant.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        subdomain:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/GymStatusEnum'
          readOnly: true
        tier:
          allOf:
          - $ref: '#/components/schemas/TierEnum'
          readOnly: true
        currency:
          type: string
          readOnly: true
        location:
          type: string
          readOnly: true
        contact_name:
          type: string
          readOnly: true
        contact_phone:
          type: string
          readOnly: true
        contact_email:
          type: string
          format: email
          readOnly: true
        subscription_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        tls_confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contact_email
      - contact_name
      - contact_phone
      - created_at
      - currency
      - id
      - location
      - name
      - status
      - subdomain
      - subscription_expires_at
      - tier
      - tls_confirmed_at
      - updated_at
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          default: ok
        app:
          type: string
          default: FitGate API
    LoginRequestRequest:
      type: object
      description: Payload for user authentication.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      description: Response containing JWT tokens, user summary, and role dashboard.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
        dashboard:
          type: object
          additionalProperties: {}
      required:
      - access
      - dashboard
      - refresh
      - user
    LogoutRequestRequest:
      type: object
      description: Payload for user logout.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    PasswordResetConfirmRequestRequest:
      type: object
      description: Payload for confirming a password reset.
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - token
    PasswordResetConfirmResponse:
      type: object
      description: Response returned upon successful password reset completion.
      properties:
        detail:
          type: string
      required:
      - detail
    PasswordResetRequestRequest:
      type: object
      description: Payload for requesting a password reset email.
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PasswordResetResponse:
      type: object
      description: Uniform response for password reset requests.
      properties:
        detail:
          type: string
      required:
      - detail
    PatchedDemoRequestUpdateRequest:
      type: object
      description: Serializer for updating status and internal notes on a demo request.
      properties:
        status:
          $ref: '#/components/schemas/DemoRequestStatusEnum'
        notes:
          type: string
    PatchedUserProfileUpdateRequest:
      type: object
      description: Payload for updating user profile (full_name and phone only).
      properties:
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
    ProposeSubdomainResponse:
      type: object
      description: Response containing proposed candidate subdomain.
      properties:
        subdomain:
          type: string
      required:
      - subdomain
    PublicDemoRequestRequest:
      type: object
      description: Public serializer for lead demo request submissions with honeypot
        field.
      properties:
        gym_name:
          type: string
          minLength: 1
          maxLength: 150
        contact_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          maxLength: 50
        city:
          type: string
          default: ''
          maxLength: 100
        email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
        message:
          type: string
          default: ''
        website:
          type: string
          writeOnly: true
          default: ''
      required:
      - contact_name
      - gym_name
      - phone
    PublicDemoRequestResponse:
      type: object
      properties:
        detail:
          type: string
        id:
          type: string
      required:
      - detail
    RoleEnum:
      enum:
      - super_admin
      - owner
      - manager
      - trainer
      - reception
      - member
      type: string
      description: |-
        * `super_admin` - Super Admin
        * `owner` - Owner
        * `manager` - Manager
        * `trainer` - Trainer
        * `reception` - Reception
        * `member` - Member
    SetPasswordFromInviteRequestRequest:
      type: object
      description: Payload for setting initial password from an invite token.
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - token
    SetPasswordFromInviteResponse:
      type: object
      description: Response returned upon successful invite password completion.
      properties:
        detail:
          type: string
      required:
      - detail
    SuperAdminResponse:
      type: object
      description: Response for created Super Admin.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - must_change_password
      - role
    TierEnum:
      enum:
      - starter
      - growth
      - pro
      type: string
      description: |-
        * `starter` - Starter
        * `growth` - Growth
        * `pro` - Pro
    TokenRefreshRequestRequest:
      type: object
      description: Payload for token refresh.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenRefreshResponse:
      type: object
      description: Response containing refreshed access token.
      properties:
        access:
          type: string
      required:
      - access
    UserProfile:
      type: object
      description: Profile representation of authenticated user.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        gym_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
      required:
      - email
      - full_name
      - gym_id
      - id
      - must_change_password
      - phone
      - role
    UserSummary:
      type: object
      description: Minimal representation of authenticated user.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        gym_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
      required:
      - email
      - full_name
      - gym_id
      - id
      - must_change_password
      - phone
      - role
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
