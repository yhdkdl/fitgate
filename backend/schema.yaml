openapi: 3.0.3
info:
  title: FitGate API
  version: 1.0.0
  description: Multi-tenant Gym Management Platform API for Ethiopian Gyms
paths:
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Validates current password and updates to new password, invalidating
        older tokens.
      summary: Change user password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates user with email and password, returning tokens and
        dashboard config.
      summary: User login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          description: Invalid credentials
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the provided refresh token.
      summary: User logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Successfully logged out
        '400':
          description: Invalid refresh token
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns profile information for the authenticated caller.
      summary: Get current user profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Password change required
    patch:
      operationId: auth_me_partial_update
      description: Updates full_name and/or phone for the authenticated caller. Rejects
        privileged fields.
      summary: Update current user profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Password change required
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: Initiates password reset process for the specified email. Always
        returns 200.
      summary: Request password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
          description: ''
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Resets user password using a single-use token and strong new password.
      summary: Confirm password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
          description: ''
        '400':
          description: Invalid token, expired token, or weak password
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Issues a fresh access token given a valid refresh token.
      summary: Refresh access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          description: Invalid or expired refresh token
  /api/auth/set-password/:
    post:
      operationId: auth_set_password_create
      description: Consumes a single-use invite token and sets initial password for
        an invited user.
      summary: Set password from invite
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordFromInviteRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPasswordFromInviteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPasswordFromInviteRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPasswordFromInviteResponse'
          description: ''
        '400':
          description: Invalid or expired token, or weak password
  /api/gym/checklist/:
    get:
      operationId: gym_checklist_retrieve
      description: Returns first-run checklist progress for the gym Owner.
      summary: Get first-run onboarding checklist
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirstRunChecklistResponse'
          description: ''
        '403':
          description: Forbidden - only Owner permitted
  /api/gym/checklist/dismiss/:
    post:
      operationId: gym_checklist_dismiss_create
      description: Persists dismissal of onboarding checklist for the gym.
      summary: Dismiss first-run onboarding checklist
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DismissChecklistResponse'
          description: ''
        '403':
          description: Forbidden - only Owner permitted
  /api/gym/settings/:
    get:
      operationId: gym_settings_retrieve
      description: Returns gym configuration and branding settings for Owner.
      summary: Get gym settings
      tags:
      - gym
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymConfig'
          description: ''
    patch:
      operationId: gym_settings_partial_update
      description: Updates Owner-editable gym settings (branding, reminders). Entitlement
        modifications by Owner return 403.
      summary: Update gym settings
      tags:
      - gym
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGymSettingsUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGymSettingsUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGymSettingsUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymConfig'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Forbidden - entitlements restricted to Super Admin or non-Owner
            access
  /api/health/:
    get:
      operationId: health_retrieve
      description: Returns the operational status of the FitGate backend service.
      summary: Health check
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
  /api/media/gym-logo/{gym_id}/:
    post:
      operationId: media_gym_logo_create
      description: Uploads and optimizes gym logo (public asset). Only accessible
        by gym Owner.
      summary: Upload gym logo
      parameters:
      - in: path
        name: gym_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - media
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadGymLogoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadGymLogoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadGymLogoResponse'
          description: ''
        '400':
          description: Validation error or missing file
        '403':
          description: Forbidden - only Owner permitted
        '404':
          description: Tenant mismatch
  /api/media/member-photos/{gym_id}/:
    get:
      operationId: media_member_photos_retrieve
      description: 'Photo list endpoint: only gym staff permitted.'
      parameters:
      - in: path
        name: gym_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - media
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: media_member_photos_create
      description: Validates image format and size (<= 2 MB), strips EXIF, resizes,
        and saves to gym-scoped authenticated storage.
      summary: Upload member photo
      parameters:
      - in: path
        name: gym_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - media
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadMemberPhotoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadMemberPhotoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadMemberPhotoResponse'
          description: ''
        '400':
          description: Validation error or missing file
        '403':
          description: Forbidden - cross-tenant access denied
        '404':
          description: Tenant mismatch
  /api/media/member-photos/{gym_id}/{filename}/:
    get:
      operationId: media_member_photos_retrieve_2
      description: Serves member photo stream only to users belonging to the specified
        gym.
      summary: Serve authenticated member photo
      parameters:
      - in: path
        name: filename
        schema:
          type: string
        required: true
      - in: path
        name: gym_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - media
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Image WebP stream
        '400':
          description: Invalid request or filename format
        '401':
          description: Authentication credentials required
        '403':
          description: Forbidden - user belongs to different gym or unauthorized role
        '404':
          description: Photo not found or tenant mismatch
  /api/platform/demo-requests/:
    get:
      operationId: platform_demo_requests_list
      description: Super Admin endpoint to view and filter demo request leads.
      summary: List demo requests
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoRequest'
          description: ''
  /api/platform/demo-requests/{id}/:
    get:
      operationId: platform_demo_requests_retrieve
      description: Super Admin endpoint to retrieve and update demo request status/notes.
      summary: Get demo request detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRequest'
          description: ''
        '404':
          description: Not found
    patch:
      operationId: platform_demo_requests_partial_update
      description: Super Admin endpoint to retrieve and update demo request status/notes.
      summary: Update demo request status or notes
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDemoRequestUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDemoRequestUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDemoRequestUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRequest'
          description: ''
        '400':
          description: Bad request
        '404':
          description: Not found
  /api/platform/demo-requests/{id}/convert/:
    get:
      operationId: platform_demo_requests_convert_retrieve
      description: Super Admin endpoint returning pre-filled data to convert a lead
        to a gym.
      summary: Convert demo request to gym form data
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRequestConvertResponse'
          description: ''
        '404':
          description: Not found
  /api/platform/demo-requests/public/:
    post:
      operationId: platform_demo_requests_public_create
      description: Public endpoint to request a demo for a gym. Only accepted on the
        apex domain.
      summary: Submit demo request
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicDemoRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicDemoRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicDemoRequestRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDemoRequestResponse'
          description: ''
        '400':
          description: Bad request or rejected on subdomain
        '429':
          description: Too many requests
  /api/platform/gyms/:
    get:
      operationId: platform_gyms_list
      description: Lists all gym tenants on the platform for Super Admin.
      summary: List gym tenants
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GymTenantSummary'
          description: ''
    post:
      operationId: platform_gyms_create
      description: Super Admin creates an active gym tenant, records bank transfer
        payment, and provisions subdomain.
      summary: Create gym tenant
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGymRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateGymRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateGymRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGymResponse'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Forbidden
  /api/platform/gyms/{gym_id}/:
    get:
      operationId: platform_gyms_retrieve
      description: Retrieves a specific gym tenant and its configuration.
      summary: Get gym tenant details
      parameters:
      - in: path
        name: gym_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymDetailResponse'
          description: ''
        '404':
          description: Not found
  /api/platform/gyms/{gym_id}/config/:
    get:
      operationId: platform_gyms_config_retrieve
      description: Super Admin views configuration and entitlements of a gym tenant
        at apex platform.
      summary: Get gym config (platform)
      parameters:
      - in: path
        name: gym_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymConfig'
          description: ''
        '404':
          description: Gym not found
    patch:
      operationId: platform_gyms_config_partial_update
      description: Super Admin updates gym tier and feature entitlements at apex platform.
      summary: Update gym entitlements (platform)
      parameters:
      - in: path
        name: gym_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymConfig'
          description: ''
        '400':
          description: Validation error
        '404':
          description: Gym not found
  /api/platform/gyms/{gym_id}/confirm-tls/:
    post:
      operationId: platform_gyms_confirm_tls_create
      description: Confirms subdomain TLS certificate, activating login access and
        establishing subscription expiry.
      summary: Confirm gym TLS certificate
      parameters:
      - in: path
        name: gym_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmTLSResponse'
          description: ''
        '400':
          description: Gym not found
        '403':
          description: Forbidden
  /api/platform/gyms/propose-subdomain/:
    get:
      operationId: platform_gyms_propose_subdomain_retrieve
      description: Generates a sanitized DNS label candidate for a proposed gym name.
      summary: Propose candidate subdomain
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposeSubdomainResponse'
          description: ''
  /api/platform/super-admins/:
    post:
      operationId: platform_super_admins_create
      description: Creates a new Super Admin account. Requires active Super Admin
        credentials.
      summary: Create additional Super Admin
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSuperAdminRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateSuperAdminRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSuperAdminRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperAdminResponse'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Forbidden
  /api/public/gym-entry/:
    get:
      operationId: public_gym_entry_retrieve
      description: Public endpoint returning gym branding, details, and active plans
        on the gym subdomain. Shows 503 if TLS is pending.
      summary: Public gym entry page
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymPublicEntryResponse'
          description: ''
        '503':
          description: Subdomain is still being secured
components:
  schemas:
    ChangePasswordRequestRequest:
      type: object
      description: Payload for changing user password.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    ChangePasswordResponse:
      type: object
      description: Response containing refreshed JWT pair and user summary.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access
      - refresh
      - user
    ChecklistItem:
      type: object
      description: Item in first-run onboarding checklist.
      properties:
        label:
          type: string
        completed:
          type: boolean
      required:
      - completed
      - label
    ConfirmTLSResponse:
      type: object
      description: Response returned upon TLS certificate confirmation.
      properties:
        gym:
          $ref: '#/components/schemas/GymTenantSummary'
        message:
          type: string
      required:
      - gym
      - message
    CreateGymRequestRequest:
      type: object
      description: Payload for Super Admin gym creation.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        subdomain:
          type: string
          minLength: 1
          maxLength: 63
        tier:
          $ref: '#/components/schemas/TierEnum'
        location:
          type: string
          default: ''
          maxLength: 255
        contact_name:
          type: string
          default: ''
          maxLength: 150
        contact_phone:
          type: string
          default: ''
          maxLength: 20
        contact_email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
        owner_name:
          type: string
          default: ''
          maxLength: 150
        owner_email:
          type: string
          format: email
          minLength: 1
        payment_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        payment_reference:
          type: string
          minLength: 1
          maxLength: 100
        payment_method:
          type: string
          minLength: 1
          default: bank_transfer
          maxLength: 30
        demo_request_id:
          type: string
          nullable: true
          maxLength: 100
      required:
      - name
      - owner_email
      - payment_amount
      - payment_reference
      - subdomain
      - tier
    CreateGymResponse:
      type: object
      description: Response returned upon successful gym tenant creation.
      properties:
        gym:
          $ref: '#/components/schemas/GymTenantSummary'
        config:
          $ref: '#/components/schemas/GymConfig'
        owner:
          $ref: '#/components/schemas/UserSummary'
        payment_id:
          type: string
          format: uuid
      required:
      - config
      - gym
      - owner
      - payment_id
    CreateSuperAdminRequestRequest:
      type: object
      description: Payload for creating an additional Super Admin account.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
