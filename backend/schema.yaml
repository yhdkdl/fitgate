      required:
      - bmi_label
      - body_fat_label
      - estimated_bmi
      - estimated_body_fat_percentage
      - id
      - is_corrected
      - lean_body_mass
      - lean_body_mass_label
      - recorded_at
      - recorded_by
      - recorded_by_name
      - trainer_name
      - waist_to_hip_ratio
    ChangePasswordRequestRequest:
      type: object
